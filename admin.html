<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Admin Panel</title>
<style>body{background:#1a2617;color:#f5efe6;font-family:sans-serif;padding:2rem;}.card{background:#2a3d24;padding:1rem;border-radius:.5rem;margin:1rem 0;}table{width:100%;border-collapse:collapse;}th,td{padding:.5rem;border-bottom:1px solid #3d5c3a;}.btn{padding:.3rem 1rem;border:none;border-radius:.3rem;cursor:pointer;}.btn-approve{background:#4caf50;color:#fff;}.btn-reject{background:#e74c3c;color:#fff;}</style>
</head>
<body>
<h1>🦏 Admin Panel</h1>
<div id="stats" class="card" style="display:flex;gap:2rem;">
  <div><strong id="totalUsers">0</strong> Users</div>
  <div><strong id="totalRevenue">0</strong> Revenue</div>
  <div><strong id="pendingWithdrawals">0</strong> Pending</div>
</div>
<div class="card"><h2>Users</h2><table><thead><tr><th>Username</th><th>Phone</th><th>Role</th><th>Action</th></tr></thead><tbody id="usersTable"></tbody></table></div>
<div class="card"><h2>Withdrawals</h2><table><thead><tr><th>User</th><th>Amount</th><th>Phone</th><th>Actions</th></tr></thead><tbody id="withdrawalsTable"></tbody></table></div>
<script type="module">
import * as db from './db.js';
const token = localStorage.getItem('token');
if (!token) window.location.href = '/';
const stats = await db.getAdminStats();
if (!stats.success) { window.location.href = '/'; }
document.getElementById('totalUsers').textContent = stats.totalUsers;
document.getElementById('totalRevenue').textContent = stats.totalRevenue;
document.getElementById('pendingWithdrawals').textContent = stats.pendingWithdrawals;
const users = await db.getUsers();
if (users.success) {
  document.getElementById('usersTable').innerHTML = users.data.map(u =>
    `<tr><td>${u.username}</td><td>${u.phone}</td><td>${u.role}</td><td><button onclick="toggleUser('${u.id}')">${u.isActive?'Deactivate':'Activate'}</button></td></tr>`
  ).join('');
}
const withdrawals = await db.getWithdrawals('pending');
if (withdrawals.success) {
  document.getElementById('withdrawalsTable').innerHTML = withdrawals.data.map(w =>
    `<tr><td>${w.userId}</td><td>${w.amount} UGX</td><td>${w.phoneNumber}</td><td><button class="btn btn-approve" onclick="approve('${w.id}')">Approve</button><button class="btn btn-reject" onclick="reject('${w.id}')">Reject</button></td></tr>`
  ).join('');
}
window.toggleUser = async (id) => { await db.toggleUserStatus(id); location.reload(); };
window.approve = async (id) => { await db.updateWithdrawal(id, 'approved'); location.reload(); };
window.reject = async (id) => { await db.updateWithdrawal(id, 'rejected'); location.reload(); };
</script>
</body>
</html>
