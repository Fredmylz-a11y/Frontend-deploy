<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhinoverse — Admin</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet"><style>:root{--gold:#d4af37;--bg:#0f0e0a;--border:rgba(212,175,55,.22);--text:#f5efe6;--muted:#9a9188}body{font-family:Outfit;background:var(--bg);color:var(--text);padding:20px;max-width:900px;margin:auto}.card{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:1rem;padding:16px;margin:12px 0}.kpi{display:flex;gap:10px}.kpi div{flex:1;background:#0003;border:1px solid var(--border);border-radius:.8rem;padding:10px}input{width:100%;height:44px;border-radius:.8rem;border:1px solid var(--border);background:#1a2617;color:#fff;padding:0 12px;margin:6px 0}.btn{height:44px;border:none;border-radius:.8rem;background:#d4af37;color:#1a2617;font-weight:800;padding:0 18px;cursor:pointer}</style></head><body><h1>RHINOVERSE — ADMIN</h1><div class="kpi"><div><b id="kpiProducts">-</b><br>Products</div><div><b id="kpiApi">-</b><br>API</div></div><div id="status" class="card">Loading...</div><div class="card"><h3>Live Products</h3><div id="products"></div></div><div class="card"><h3>Add Product</h3><input id="pName" placeholder="Name"><input id="pPrice" type="number" placeholder="Price"><input id="pDaily" type="number" placeholder="Daily"><input id="pDays" type="number" placeholder="Days"><input id="pBadge" placeholder="Badge"><button class="btn" onclick="addProduct()">Create</button> <button class="btn" style="background:#333;color:#fff" onclick="load()">Refresh</button></div><script type="module">import{fetchProducts,apiCall}from"./db.js";const $=s=>document.getElementById(s);async function load(){try{const d=await fetchProducts();const list=Array.isArray(d)?d:(d.data||[]);$("kpiProducts").textContent=list.length;$("kpiApi").textContent="LIVE";$("status").textContent="✅ Connected - "+list.length+" products";$("products").innerHTML=list.map(p=>"<div style=display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222><span><b>"+p.name+"</b> "+p.price+" UGX</span><span>ID "+p.id+"</span></div>").join("")}catch(e){$("status").textContent="❌ "+e.message}}window.addProduct=async()=>{const b={name:$("pName").value,price:Number($("pPrice").value),dailyIncome:Number($("pDaily").value),cycleDays:Number($("pDays").value)||60,badge:$("pBadge").value,image:"calf",totalIncome:Number($("pDaily").value)*(Number($("pDays").value)||60)};if(!b.name||!b.price)return alert("Name+Price required");try{await apiCall("/products","POST",b);alert("Created");load()}catch(e){alert(e.message)}};window.load=load;load();</script></body></html>
